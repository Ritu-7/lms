<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" ry="16" fill="url(#bg)"/>

  <!-- Stacked layers icon (3 lines representing layers) -->
  <!-- Top layer -->
  <path d="M12 20 L32 11 L52 20 L32 29 Z" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Middle layer lines -->
  <path d="M12 32 L32 41 L52 32" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bottom layer lines -->
  <path d="M12 26 L32 35 L52 26" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Cyan dot (top-right) -->
  <circle cx="52" cy="12" r="6" fill="#22d3ee" stroke="white" stroke-width="2"/>
</svg>
